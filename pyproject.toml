[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS - Autonomous Intelligence & Decision Engine (Ethereum domain, domain-independent core)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "torch-geometric>=2.5"]
postgres = ["psycopg2-binary>=2.9"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
analytics = ["duckdb>=1.0"]
mlflow = ["mlflow>=2.14"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
all = [
    "torch>=2.3", "torch-geometric>=2.5",
    "psycopg2-binary>=2.9",
    "xgboost>=2.0", "lightgbm>=4.0",
    "duckdb>=1.0", "mlflow>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
